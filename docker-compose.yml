services:
  frontend:
    image: docker-website-frontend:${RELEASE_SHA:-dev}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    networks:
      - docker-website-network
    environment:
      API_URL: ${API_URL}
    volumes:
      - ./frontend/images:/usr/share/nginx/html/images
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: docker-website-backend:${RELEASE_SHA:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      CONTACT_TO: ${CONTACT_TO}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
    networks:
      - docker-website-network
    restart: unless-stopped
    volumes:
      - ./frontend/images:/usr/src/app/frontend/images

  mongodb:
    image: mongo:4.4.6
    volumes:
      - mongodb_data:/data/db
      - ./backend/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - docker-website-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: MongoAdmin
      MONGO_INITDB_ROOT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      MONGO_INITDB_DATABASE: docker-website
      MONGODB_INITDB_AUTH_DATABASE: docker-website
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "admin", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    command: ["--auth"]

networks:
  docker-website-network:
    driver: bridge

volumes:
  mongodb_data: 