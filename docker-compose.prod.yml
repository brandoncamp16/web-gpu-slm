services:
  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Local HTTPS certificate: create it with ./scripts/make-local-cert.sh
      - ./certs/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./certs/server.key:/etc/nginx/ssl/server.key:ro
      # Public CA certificate, downloadable at http://<host>/ca.crt (the CA key is never mounted)
      - ./certs/ca.crt:/usr/share/nginx/html/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3