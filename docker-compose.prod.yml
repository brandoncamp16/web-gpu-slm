services:
  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site.pem:/etc/nginx/ssl/example.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3