services:
  frontend:
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk http://localhost/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    networks:
      - docker-website-network
    ports:
      - "1025:1025"
      - "8025:8025"