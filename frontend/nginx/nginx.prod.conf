# Prod mode: HTTPS with the local certificate from scripts/make-local-cert.sh.
# server_name _ matches any host, so the app works when opened by IP address
# (e.g. https://192.168.68.61 from a phone on the same network).

server {
    listen 80;
    server_name _;

    # The public CA certificate is served over plain http so a phone can
    # download and trust it before it can open the https site.
    location = /ca.crt {
        root /usr/share/nginx/html;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="webgpu-slm-local-ca.crt"';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend Static Files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests to Backend
    # Cloud baseline requests carry the image as base64
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:1616;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Pass the client's address so runs can record which device made them
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
